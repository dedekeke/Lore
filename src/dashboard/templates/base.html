<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lore — {% block title %}Dashboard{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    :root { --bg: #0d1117; --surface: #161b22; --border: #30363d; --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff; --green: #3fb950; --red: #f85149; --yellow: #d29922; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    nav { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0.75rem 1.5rem; display: flex; gap: 1.5rem; align-items: center; }
    nav .brand { font-weight: 700; font-size: 1.1rem; color: var(--text); }
    nav a { color: var(--muted); font-size: 0.9rem; }
    nav a:hover, nav a.active { color: var(--text); }
    .container { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }
    h1 { font-size: 1.4rem; margin-bottom: 1rem; }
    h2 { font-size: 1.1rem; margin-bottom: 0.75rem; color: var(--muted); }
    table { width: 100%; border-collapse: collapse; margin-bottom: 1.5rem; }
    th, td { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
    th { color: var(--muted); font-weight: 600; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em; }
    tr:hover { background: var(--surface); }
    .badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 12px; font-size: 0.75rem; font-weight: 600; }
    .badge-active { background: rgba(56, 139, 253, 0.15); color: var(--accent); }
    .badge-completed { background: rgba(63, 185, 80, 0.15); color: var(--green); }
    .badge-abandoned, .badge-rejected { background: rgba(248, 81, 73, 0.15); color: var(--red); }
    .badge-pending { background: rgba(210, 153, 34, 0.15); color: var(--yellow); }
    .badge-accepted { background: rgba(63, 185, 80, 0.15); color: var(--green); }
    .badge-blocked, .badge-unknown { background: rgba(139, 148, 158, 0.15); color: var(--muted); }
    .badge-preference { background: rgba(56, 139, 253, 0.15); color: var(--accent); }
    .badge-fact { background: rgba(63, 185, 80, 0.15); color: var(--green); }
    .badge-constraint { background: rgba(248, 81, 73, 0.15); color: var(--red); }
    .badge-lesson { background: rgba(210, 153, 34, 0.15); color: var(--yellow); }
    .btn { display: inline-block; padding: 0.3rem 0.75rem; border-radius: 6px; font-size: 0.8rem; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; }
    .btn:hover { border-color: var(--muted); }
    .btn-danger { border-color: var(--red); color: var(--red); }
    .btn-danger:hover { background: rgba(248, 81, 73, 0.15); }
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; }
    .stat-card .value { font-size: 1.8rem; font-weight: 700; }
    .stat-card .label { font-size: 0.8rem; color: var(--muted); }
    .stat-card .sub { font-size: 0.7rem; color: var(--muted); margin-top: 0.2rem; }
    .empty { text-align: center; padding: 2rem; color: var(--muted); }
    .mono { font-family: 'SF Mono', Menlo, monospace; font-size: 0.8rem; }
    .clickable-cell { max-width: 400px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
    .clickable-cell:hover { color: var(--accent); }
    pre { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 0.75rem; font-size: 0.8rem; overflow-x: auto; margin: 0.5rem 0; }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center; }
    .modal-overlay.active { display: flex; }
    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; max-width: 700px; width: 90%; max-height: 80vh; overflow-y: auto; padding: 1.5rem; position: relative; }
    .modal-close { position: absolute; top: 0.75rem; right: 1rem; background: none; border: none; color: var(--muted); font-size: 1.2rem; cursor: pointer; }
    .modal-close:hover { color: var(--text); }
    .modal-title { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; color: var(--muted); }
    .modal-body { font-size: 0.85rem; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
    .section-note { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 0.75rem 1rem; margin-bottom: 1.5rem; font-size: 0.8rem; color: var(--muted); }
  </style>
</head>
<body>
  <nav>
    <span class="brand">Lore</span>
    <a href="/">Projects</a>
    <a href="/rules">Rules</a>
    <a href="/analytics">Analytics</a>
  </nav>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
  <div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <button class="modal-close" onclick="closeModal()">&times;</button>
      <div class="modal-title" id="modal-title"></div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>
  <script>
    function showModal(title, text) {
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-body').textContent = text;
      document.getElementById('modal').classList.add('active');
    }
    function closeModal() {
      document.getElementById('modal').classList.remove('active');
    }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
  </script>
</body>
</html>
