[package]
name = "lore"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Persistent episodic memory + codebase graph for AI coding assistants, exposed over MCP."
readme = "README.md"
keywords = ["mcp", "ai", "memory", "pgvector", "agents"]
categories = ["command-line-utilities", "database"]

[features]
default = ["local-embeddings"]
local-embeddings = ["dep:ort", "dep:tokenizers", "dep:ndarray"]
eval = []

[dependencies]
rmcp = { version = "0.10.0", features = ["server", "transport-io", "transport-sse-server", "macros", "schemars", "elicitation"] }
schemars = "1.0"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"], default-features = false }
dirs-next = "2.0"
ort = { version = "2.0.0-rc.12", optional = true }
tokenizers = { version = "0.22", optional = true, default-features = false, features = ["onig"] }
ndarray = { version = "0.17", optional = true }
pgvector = { version = "0.4", features = ["sqlx"] }
moka = { version = "0.12", features = ["future"] }
axum = "0.8"
minijinja = "2"
ignore = { version = "0.4.25", default-features = false }
sha2 = { version = "0.11.0", default-features = false }
git2 = { version = "0.20", default-features = false }
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"
petgraph = "0.7"
regex = "1"

[dev-dependencies]
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres"] }
